apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-challenge-app
  labels:
    app: devops-challenge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-challenge
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: devops-challenge
    spec:
      containers:
        - name: app
          image: 109804294707.dkr.ecr.us-east-1.amazonaws.com/devops-challenge-app:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_VERSION
              value: "1.0.0"
